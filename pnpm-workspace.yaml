packages:
  - '.'

# --- Security settings ---

# Delay installation of newly published versions by 24 hours.
# Malicious releases are usually discovered and removed within hours.
minimumReleaseAge: 1440

# Our own packages are published by us with 2FA; use new versions right away.
minimumReleaseAgeExclude:
  - '@simmalugnt-se/*'

# Fail installation when unreviewed build scripts are present.
strictDepBuilds: true

# Block transitive dependencies from using git/tarball sources.
blockExoticSubdeps: true

# --- Build scripts ---
# Only these trusted packages are allowed to run postinstall / build scripts.
# All other dependencies will have their lifecycle scripts blocked.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# --- Overrides ---
# Moved from package.json: pnpm 11 no longer reads the "pnpm" field there.
overrides:
  mcp-handler: 1.1.0
  ws: 8.21.3

# mcp-handler 1.1.0 (pinned above) asks for @modelcontextprotocol/sdk 1.26.0 exactly, while
# @payloadcms/plugin-mcp ships 1.30.0. That pairing is Payload's own; accept it rather than warn on
# every install and hide warnings that matter.
peerDependencyRules:
  allowedVersions:
    mcp-handler>@modelcontextprotocol/sdk: 1.30.0
